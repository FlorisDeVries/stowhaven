services:
    backup-api:
        container_name: backup-api
        image: ${DOCKER_REGISTRY-}backup-api:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: src/services/api/Dockerfile
        env_file:
            - .env
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:8080
            - ALLOW_DEVELOPMENT_ANONYMOUS_AUTHENTICATION=true
            - LOG_PATH=/var/log
        volumes:
            - ./run/api/data:/var/lib/backup-api
        user: ${UID}:${GID}
        ports:
            - 127.0.0.1:8210:8080
        depends_on:
            - azurite
        logging:
            driver: "gelf"
            options:
                gelf-address: "udp://127.0.0.1:12201"
                tag: "backup-api"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 0.5g

    backup-api-dapr:
        container_name: backup-api-dapr
        image: "daprio/daprd:${DAPR_VERSION:-1.13.6}"
        env_file:
            - .env
        command: [
            "./daprd",
            "-app-id", "backup-api",
            "-app-port", "8080",
            "-components-path", "/components",
            "-config", "/configuration/config.yaml"
        ]
        volumes:
            - "./run/components/:/components"
            - "./run/configuration/:/configuration"
        depends_on:
            backup-api:
                condition: service_started
            azurite:
                condition: service_started
            redis:
                condition: service_healthy
        network_mode: "service:backup-api"
        logging:
            driver: "gelf"
            options:
                gelf-address: "udp://127.0.0.1:12201"
                tag: "backup-api-dapr"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 0.5g

    backup-worker:
        container_name: backup-worker
        image: ${DOCKER_REGISTRY-}backup-worker:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: src/services/worker/Dockerfile
        env_file:
            - .env
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:8080
            - LOG_PATH=/var/log
        volumes:
            - ./run/api/data:/var/lib/backup-api
        user: ${UID}:${GID}
        ports:
            - 127.0.0.1:8220:8080
        depends_on:
            - azurite
        logging:
            driver: "gelf"
            options:
                gelf-address: "udp://127.0.0.1:12201"
                tag: "backup-worker"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 0.5g

    backup-worker-dapr:
        container_name: backup-worker-dapr
        image: "daprio/daprd:${DAPR_VERSION:-1.13.6}"
        env_file:
            - .env
        command: [
            "./daprd",
            "-app-id", "backup-worker",
            "-app-port", "8080",
            "-components-path", "/components",
            "-config", "/configuration/config.yaml"
        ]
        volumes:
            - "./run/components/:/components"
            - "./run/configuration/:/configuration"
        depends_on:
            backup-worker:
                condition: service_started
            azurite:
                condition: service_started
            redis:
                condition: service_healthy
        network_mode: "service:backup-worker"
        logging:
            driver: "gelf"
            options:
                gelf-address: "udp://127.0.0.1:12201"
                tag: "backup-worker-dapr"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 0.5g

    backup-gateway:
        container_name: backup-gateway
        image: ${DOCKER_REGISTRY-}gateway:${IMAGE_TAG:-latest}
        build:
            context: .
            dockerfile: src/services/gateway/Dockerfile
        environment:
            - ASPNETCORE_ENVIRONMENT=Development
            - ASPNETCORE_URLS=http://+:8080
            - Gateway__ApiBaseUrl=http://backup-api:8080
            - Gateway__WorkerBaseUrl=http://backup-worker:8080
        ports:
            - 127.0.0.1:8200:8080
        depends_on:
            - backup-api
            - backup-worker
        logging:
            driver: "gelf"
            options:
                gelf-address: "udp://127.0.0.1:12201"
                tag: "backup-gateway"
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 0.5g

    #
    # Dependencies (Storage, Observability)
    #

    zipkin:
        container_name: zipkin
        image: openzipkin/zipkin-slim
        hostname: zipkin
        ports:
            - 127.0.0.1:9411:9411
        restart: unless-stopped
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 512m

    dev-dashboard:
        container_name: aspire-dashboard
        image: mcr.microsoft.com/dotnet/aspire-dashboard:9
        hostname: aspire-dashboard
        environment:
            - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
        ports:
            - 127.0.0.1:18888:18888
            - 127.0.0.1:4317:18889
        restart: unless-stopped

    azurite:
        container_name: azurite
        image: mcr.microsoft.com/azure-storage/azurite
        hostname: azurite
        restart: unless-stopped
        volumes:
            - azurite-data:/data
        ports:
            - 127.0.0.1:10000:10000  # Blob service
            - 127.0.0.1:10001:10001  # Queue service
            - 127.0.0.1:10002:10002  # Table service
        command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --debug /data/debug.log

    redis:
        container_name: backup-redis
        image: redis:7-alpine
        hostname: redis
        restart: unless-stopped
        command: redis-server --appendonly yes
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 5
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 256m

    redisinsight:
        container_name: backup-redisinsight
        image: redis/redisinsight:latest
        hostname: redisinsight
        restart: unless-stopped
        ports:
            - 127.0.0.1:5540:5540
        volumes:
            - redisinsight-data:/data
        depends_on:
            redis:
                condition: service_healthy
        deploy:
            resources:
                limits:
                    cpus: '0.25'
                    memory: 512m

volumes:
    azurite-data:
    redis-data:
    redisinsight-data:
