# NOTE ABOUT LOCAL DEVELOPMENT:
# Production uses the Dapr component "state.azure.cosmosdb" for manifest-state-store.
# Local development intentionally keeps the same Dapr component name but backs it with
# "state.azure.blobstorage" on Azurite. This preserves the app's Dapr key/value calls
# without requiring a local Cosmos emulator or a billable cloud Cosmos account.
#
# Keep this local substitute compatible by using only Dapr state-store primitives that
# are supported by both backends, such as get, save, ETags, and optimistic concurrency.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: manifest-state-store
spec:
    type: state.azure.blobstorage
    version: v1
    metadata:
        # Match production: shared state keys must not be prefixed per-app (Dapr default).
        - name: keyPrefix
          value: name
        - name: containerName
          value: manifest-state-store
        - name: connectionString
          secretKeyRef:
              name: AZURE_STORAGE_CONNECTION_STRING
auth:
    secretStore: secret-store
