# Dapr Pub/Sub component for local development using Redis Streams.
#
# Production uses Azure Service Bus Topics via Bicep. Azure Storage Queues are not
# supported as a Dapr pub/sub broker, so local Docker Compose uses Redis instead.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: backup-events-pubsub
spec:
    type: pubsub.redis
    version: v1
    metadata:
        - name: redisHost
          value: redis:6379
        - name: redisPassword
          value: ""
        - name: consumerID
          value: backup-worker
        - name: enableTLS
          value: "false"

