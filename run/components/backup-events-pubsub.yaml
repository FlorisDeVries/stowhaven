# Dapr binding components for local development using Azurite Storage Queues.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: backup-events-output
spec:
    type: bindings.azure.storagequeues
    version: v1
    metadata:
        - name: accountName
          value: devstoreaccount1
        - name: accountKey
          secretKeyRef:
              name: DATA_STORAGE_ACCOUNT_KEY
              key: DATA_STORAGE_ACCOUNT_KEY
        - name: queueName
          value: backup-events
        - name: endpoint
          value: http://azurite:10001
        - name: direction
          value: output
        - name: ttlInSeconds
          value: "604800"
auth:
    secretStore: secret-store
scopes:
    - backup-api
---
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: backup-events-input
spec:
    type: bindings.azure.storagequeues
    version: v1
    metadata:
        - name: accountName
          value: devstoreaccount1
        - name: accountKey
          secretKeyRef:
              name: DATA_STORAGE_ACCOUNT_KEY
              key: DATA_STORAGE_ACCOUNT_KEY
        - name: queueName
          value: backup-events
        - name: endpoint
          value: http://azurite:10001
        - name: direction
          value: input
        - name: route
          value: /api/backupevents/backup-run-committed
        - name: pollingInterval
          value: 10s
        - name: visibilityTimeout
          value: 10m
auth:
    secretStore: secret-store
scopes:
    - backup-worker

