# NOTE ABOUT LOCAL DEVELOPMENT:
# Azurite (the local Azure Storage emulator) does NOT support the Azure Table Storage API.
# It only supports the Blob and Queue APIs.
#
# The production Dapr component uses state.azure.tablestorage, but local development uses
# state.azure.blobstorage so the Dapr state-store abstraction works reliably with Azurite.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
    name: device-registry-state-store
spec:
    type: state.azure.blobstorage
    version: v1
    metadata:
        # Match production: shared state keys must not be prefixed per-app (Dapr default).
        - name: keyPrefix
          value: name
        - name: containerName
          value: device-registry-state-store
        - name: connectionString
          secretKeyRef:
              name: AZURE_STORAGE_CONNECTION_STRING
auth:
    secretStore: secret-store