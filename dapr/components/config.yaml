# DAPR Configuration for backup API
apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: backup-api-config
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://zipkin:9411/api/v2/spans"
  metric:
    enabled: true
  secrets:
    scopes:
    - storeName: "azurekeyvault"
      defaultAccess: "allow"
