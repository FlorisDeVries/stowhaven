# DAPR Pub/Sub for backup events using Azure Service Bus
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: backup-pubsub
spec:
  type: pubsub.azure.servicebus
  version: v1
  metadata:
  - name: connectionString
    secretKeyRef:
      name: servicebus-connection-string
  - name: consumerID
    value: "backup-api"
