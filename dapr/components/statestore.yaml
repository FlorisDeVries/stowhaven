# DAPR State Store for Redis (Azure Cache for Redis)
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: statestore
spec:
  type: state.redis
  version: v1
  metadata:
  - name: redisHost
    secretKeyRef:
      name: redis-host
  - name: redisPassword
    secretKeyRef:
      name: redis-password
  - name: enableTLS
    value: "true"
  - name: failover
    value: "true"
