name: Recovery integration tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/run-recovery-e2e.py'
      - '.github/workflows/recovery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/run-recovery-e2e.py'
      - '.github/workflows/recovery-tests.yml'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: '10.0.x'
      - name: Exercise real queue, worker recovery, and encrypted restore
        run: python3 scripts/run-recovery-e2e.py --artifacts /tmp/stowhaven-recovery
