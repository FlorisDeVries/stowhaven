name: Deploy Azure Function & Infra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  LOCATION: westeurope
  RG_NAME: rg-fdev-weu-backup-prd
  NAME_SUFFIX: fdev-weu-prd
  NAME_SUFFIX_STR: fdevweuprd

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Clear Azure CLI cache
        run: az account clear

      - name: Re-authenticate and verify
        run: |
          az login --service-principal \
            --username ${{ secrets.AZURE_CLIENT_ID }} \
            --tenant ${{ secrets.AZURE_TENANT_ID }} \
            --federated-token $AZURE_OIDC_TOKEN
          az account show

      - name: Create Resource Group
        run: |
          az group create -n $RG_NAME -l $LOCATION

      - name: Deploy Bicep
        run: |
          az deployment group create \
            -g $RG_NAME \
            -f infra/main.bicep \
            -p location=$LOCATION \
            -p nameSuffix=$NAME_SUFFIX \
            -p nameSuffixStr=$NAME_SUFFIX_STR \
            -p lifecycleArchiveAfterDays=30

      - name: Resolve outputs
        id: outputs
        run: |
          OUT=$(az deployment group show -g $RG_NAME -n $(az deployment group list -g $RG_NAME --query "[].name" -o tsv | tail -n1) -o json)
          echo "FUNC_NAME=$(echo $OUT | jq -r '.properties.outputs.functionAppName.value')" >> $GITHUB_ENV
          echo "DATA_SA=$(echo $OUT | jq -r '.properties.outputs.dataStorageAccountName.value')" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .python_packages/lib/site-packages

      - name: Build package (zip)
        working-directory: api
        run: |
          zip -r ../package.zip . -x "__pycache__/*"

      - name: Deploy Function
        run: |
          az functionapp deploy \
            --resource-group $RG_NAME \
            --name $FUNC_NAME \
            --src-path package.zip \
            --type zip
