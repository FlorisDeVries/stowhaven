name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number to deploy (leave empty for latest)'
        required: false
        type: string
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - 'production'
          - 'staging'
  workflow_call:
    inputs:
      build_number:
        description: 'Build number to deploy'
        required: false
        type: string
      environment:
        description: 'Environment to deploy to'
        required: false
        default: 'production'
        type: string

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  RG_NAME: rg-fdev-weu-backup-prd
  FUNCTION_APP_NAME: func-fdev-weu-prd

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment: ${{ github.event.inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
    - name: Determine build number
      id: build-info
      run: |
        if [ "${{ github.event.inputs.build_number }}" != "" ]; then
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
        else
          # Get the latest successful build
          BUILD_NUMBER="${{ github.event.workflow_run.run_number || github.run_number }}"
        fi
        echo "Using build number: $BUILD_NUMBER"
        echo "build-number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: function-app-${{ steps.build-info.outputs.build-number }}
        path: ./publish
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Download build info
      uses: actions/download-artifact@v4
      with:
        name: build-info-${{ steps.build-info.outputs.build-number }}
        path: ./
        github-token: ${{ secrets.GITHUB_TOKEN }}
        repository: ${{ github.repository }}
        run-id: ${{ github.event.workflow_run.id }}

    - name: Display build information
      run: |
        echo "Deploying build artifact:"
        cat build-info.txt
        echo ""
        echo "Artifact contents:"
        ls -la publish/

    - name: Azure Login
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Check Function App exists
      run: |
        if ! az functionapp show --name $FUNCTION_APP_NAME --resource-group $RG_NAME >/dev/null 2>&1; then
          echo "❌ Function App $FUNCTION_APP_NAME not found in resource group $RG_NAME"
          echo "Please run the Infrastructure pipeline first to create the resources."
          exit 1
        fi
        echo "✅ Function App $FUNCTION_APP_NAME found"

    - name: Deploy Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.FUNCTION_APP_NAME }}
        package: ./publish

    - name: Post-deployment verification
      run: |
        echo "Restarting Function App to ensure clean state..."
        az functionapp restart --name $FUNCTION_APP_NAME --resource-group $RG_NAME
        
        # Wait for restart
        sleep 30
        
        # Check function app status
        STATUS=$(az functionapp show --name $FUNCTION_APP_NAME --resource-group $RG_NAME --query "state" -o tsv)
        echo "Function App status: $STATUS"
        
        if [ "$STATUS" != "Running" ]; then
          echo "⚠️  Function App is not in Running state"
        else
          echo "✅ Function App is running"
        fi
        
        # Get the function app URL
        URL=$(az functionapp show --name $FUNCTION_APP_NAME --resource-group $RG_NAME --query "defaultHostName" -o tsv)
        echo "Function App URL: https://$URL"

    - name: Create deployment summary
      run: |
        echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Environment**: ${{ github.event.inputs.environment || 'production' }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ steps.build-info.outputs.build-number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Function App**: $FUNCTION_APP_NAME" >> $GITHUB_STEP_SUMMARY
        echo "- **Resource Group**: $RG_NAME" >> $GITHUB_STEP_SUMMARY
        echo "- **Deployment Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Build Information" >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
        cat build-info.txt >> $GITHUB_STEP_SUMMARY
        echo '```' >> $GITHUB_STEP_SUMMARY
