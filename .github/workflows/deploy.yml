name: Deploy Azure Function & Infra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  LOCATION: westeurope
  RG_NAME: rg-fdev-weu-backup-prd
  NAME_SUFFIX: fdev-weu-prd
  NAME_SUFFIX_STR: fdevweuprd

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      function-name: ${{ steps.get-outputs.outputs.function-name }}
      storage-name: ${{ steps.get-outputs.outputs.storage-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name $RG_NAME --location $LOCATION || echo "Resource group may already exist"

      - name: Compile Bicep to ARM
        run: |
          az bicep build --file infra/main.bicep --outfile infra/main.json

      - name: Deploy Infrastructure
        run: |
          DEPLOYMENT_NAME="infra-$(date +%Y%m%d-%H%M%S)"
          echo "Deploying infrastructure with name: $DEPLOYMENT_NAME"
          
          # Deploy using compiled ARM template to avoid Bicep CLI issues
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/main.json \
            --parameters location="$LOCATION" \
            --parameters nameSuffix="$NAME_SUFFIX" \
            --parameters nameSuffixStr="$NAME_SUFFIX_STR" \
            --parameters lifecycleArchiveAfterDays=30 \
            --name "$DEPLOYMENT_NAME" \
            --only-show-errors

      - name: Get deployment outputs
        id: get-outputs
        run: |
          # Get the latest deployment
          DEPLOYMENT_NAME=$(az deployment group list --resource-group $RG_NAME --query "max_by([], &properties.timestamp).name" --output tsv)
          echo "Latest deployment: $DEPLOYMENT_NAME"
          
          # Get outputs with explicit queries
          FUNC_NAME=$(az deployment group show --resource-group $RG_NAME --name "$DEPLOYMENT_NAME" --query "properties.outputs.functionAppName.value" --output tsv)
          STORAGE_NAME=$(az deployment group show --resource-group $RG_NAME --name "$DEPLOYMENT_NAME" --query "properties.outputs.dataStorageAccountName.value" --output tsv)
          
          echo "Function App: $FUNC_NAME"
          echo "Storage Account: $STORAGE_NAME"
          
          # Validate outputs
          if [ -z "$FUNC_NAME" ] || [ "$FUNC_NAME" = "null" ]; then
            echo "ERROR: Function App name not found"
            exit 1
          fi
          
          if [ -z "$STORAGE_NAME" ] || [ "$STORAGE_NAME" = "null" ]; then
            echo "ERROR: Storage Account name not found" 
            exit 1
          fi
          
          echo "function-name=$FUNC_NAME" >> $GITHUB_OUTPUT
          echo "storage-name=$STORAGE_NAME" >> $GITHUB_OUTPUT

  function:
    runs-on: ubuntu-latest
    needs: infrastructure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .python_packages/lib/site-packages

      - name: Build package
        working-directory: api
        run: |
          zip -r ../function-package.zip . -x "__pycache__/*" "*.pyc" "tests/*"

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.function-name }}
          package: function-package.zip

      - name: Verify deployment
        run: |
          FUNC_NAME="${{ needs.infrastructure.outputs.function-name }}"
          echo "Function App: $FUNC_NAME"
          echo "Storage Account: ${{ needs.infrastructure.outputs.storage-name }}"
          echo "Function App URL: https://$FUNC_NAME.azurewebsites.net"
