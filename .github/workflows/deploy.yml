name: Deploy Stowhaven

on:
  workflow_dispatch:
    inputs:
      imageTag:
        description: 'Container image tag to deploy. Defaults to the commit SHA.'
        required: false
        type: string
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'deploy/bicep/**'
      - 'src/**'
      - 'tests/**'
      - 'FlorisDeV.BackupApi.sln'
      - 'Dockerfile'
      - '.dockerignore'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy.yml'
      - 'deploy/bicep/**'
      - 'src/**'
      - 'tests/**'
      - 'FlorisDeV.BackupApi.sln'
      - 'Dockerfile'
      - '.dockerignore'

env:
  TEMPLATE_FILE: deploy/bicep/main.bicep
  PARAMETERS_FILE: deploy/bicep/main.bicepparam
  API_IMAGE_NAME: backup-api
  WORKER_IMAGE_NAME: backup-worker
  GATEWAY_IMAGE_NAME: gateway
  # GHCR requires a lowercase repository path, for example ghcr.io/example/stowhaven.
  IMAGE_REGISTRY: ${{ vars.GHCR_IMAGE_REGISTRY }}

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI - Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore FlorisDeV.BackupApi.sln

      - name: Build solution
        run: dotnet build FlorisDeV.BackupApi.sln --configuration Release --no-restore

      - name: Build Gateway
        run: dotnet build src/services/gateway/Gateway.csproj --configuration Release

      - name: Test solution
        run: dotnet test FlorisDeV.BackupApi.sln --configuration Release --no-build --verbosity normal

  validate:
    name: CD - Validate Bicep
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
      AZURE_NAME_SUFFIX_STR: ${{ vars.AZURE_NAME_SUFFIX_STR }}
      AZURE_COSMOS_ACCOUNT_NAME: ${{ vars.AZURE_COSMOS_ACCOUNT_NAME }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
      GATEWAY_AUTH_CLIENT_ID: ${{ vars.GATEWAY_AUTH_CLIENT_ID }}
      API_AUTH_CLIENT_ID: ${{ vars.API_AUTH_CLIENT_ID }}
      API_AUTH_AUDIENCE: ${{ vars.API_AUTH_AUDIENCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check Azure configuration
        run: |
          missing=0
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_NAME_SUFFIX AZURE_NAME_SUFFIX_STR AZURE_COSMOS_ACCOUNT_NAME IMAGE_REGISTRY GHCR_PULL_USERNAME GATEWAY_AUTH_CLIENT_ID API_AUTH_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub repository variable or secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Create these as repository-level variables or repository-level secrets, not environment-only values." >&2
            exit 1
          fi

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6f # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure resource providers
        run: |
          missing=0
          for namespace in \
            Microsoft.App \
            Microsoft.DocumentDB \
            Microsoft.Insights \
            Microsoft.KeyVault \
            Microsoft.ManagedIdentity \
            Microsoft.OperationalInsights \
            Microsoft.Storage; do
            state=$(az provider show --namespace "$namespace" --query registrationState --output tsv 2>/dev/null || echo "NotRegistered")
            echo "$namespace: $state"
            if [ "$state" != "Registered" ]; then
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more Azure resource providers are not registered. Register them once from a subscription-level Azure CLI session, then rerun the workflow." >&2
            exit 1
          fi

      - name: Build Bicep
        run: |
          az bicep build --file "$TEMPLATE_FILE" --stdout >/tmp/main.json
          az bicep build-params --file "$PARAMETERS_FILE" --stdout >/tmp/main.parameters.json

      - name: Validate foundation phase
        run: |
          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETERS_FILE" \
            --parameters deployContainerApps=false nameSuffix="$AZURE_NAME_SUFFIX" nameSuffixStr="$AZURE_NAME_SUFFIX_STR" cosmosAccountName="$AZURE_COSMOS_ACCOUNT_NAME" containerImageRegistry="$IMAGE_REGISTRY" \
            --output none

      - name: Validate full deployment phase
        run: |
          IMAGE_TAG="${{ github.event.inputs.imageTag || github.sha }}"
          API_AUTH_PARAMS=()
          if [ -n "$API_AUTH_CLIENT_ID" ]; then
            API_AUTH_PARAMS+=(--parameters)
            API_AUTH_PARAMS+=(apiAuthClientId="$API_AUTH_CLIENT_ID")
            API_AUTH_PARAMS+=(apiAuthAudience="${API_AUTH_AUDIENCE:-api://$API_AUTH_CLIENT_ID}")
          fi

          az deployment group validate \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETERS_FILE" \
            --parameters imageTag="$IMAGE_TAG" deployContainerApps=true nameSuffix="$AZURE_NAME_SUFFIX" nameSuffixStr="$AZURE_NAME_SUFFIX_STR" cosmosAccountName="$AZURE_COSMOS_ACCOUNT_NAME" containerImageRegistry="$IMAGE_REGISTRY" \
            --parameters gatewayAuthClientId="$GATEWAY_AUTH_CLIENT_ID" gatewayAuthClientSecret="validation-placeholder" \
            --parameters ghcrPullUsername="$GHCR_PULL_USERNAME" ghcrPullToken="validation-placeholder" \
            "${API_AUTH_PARAMS[@]}" \
            --output none

  deploy-foundation:
    name: CD - Deploy foundation
    runs-on: ubuntu-latest
    needs: validate
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
      AZURE_NAME_SUFFIX_STR: ${{ vars.AZURE_NAME_SUFFIX_STR }}
      AZURE_COSMOS_ACCOUNT_NAME: ${{ vars.AZURE_COSMOS_ACCOUNT_NAME }}
    outputs:
      image_tag: ${{ steps.deploy.outputs.image_tag }}
      storage_account_name: ${{ steps.deploy.outputs.storage_account_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6f # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy foundation resources
        id: deploy
        run: |
          DEPLOYMENT_NAME="foundation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAG="${{ github.event.inputs.imageTag || github.sha }}"

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETERS_FILE" \
            --parameters imageTag="$IMAGE_TAG" deployContainerApps=false nameSuffix="$AZURE_NAME_SUFFIX" nameSuffixStr="$AZURE_NAME_SUFFIX_STR" cosmosAccountName="$AZURE_COSMOS_ACCOUNT_NAME" containerImageRegistry="$IMAGE_REGISTRY" \
            --output none

          STORAGE_ACCOUNT_NAME=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query "properties.outputs.dataStorageAccountName.value" \
            --output tsv)

          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "storage_account_name=$STORAGE_ACCOUNT_NAME" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: CD - Build and push images
    runs-on: ubuntu-latest
    needs: deploy-foundation
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Docker login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/services/api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ needs.deploy-foundation.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ needs.deploy-foundation.outputs.image_tag }}
          cache-from: type=gha,scope=stowhaven-api
          cache-to: type=gha,mode=max,scope=stowhaven-api

      - name: Build and push worker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/services/worker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:${{ needs.deploy-foundation.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.WORKER_IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ needs.deploy-foundation.outputs.image_tag }}
          cache-from: type=gha,scope=backup-worker
          cache-to: type=gha,mode=max,scope=backup-worker

      - name: Build and push Gateway image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: src/services/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ env.GATEWAY_IMAGE_NAME }}:${{ needs.deploy-foundation.outputs.image_tag }}
            ${{ env.IMAGE_REGISTRY }}/${{ env.GATEWAY_IMAGE_NAME }}:latest
          build-args: |
            BUILD_VERSION=${{ needs.deploy-foundation.outputs.image_tag }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

  deploy-apps:
    name: CD - Deploy Container Apps
    runs-on: ubuntu-latest
    needs:
      - deploy-foundation
      - build-and-push
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID || secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID || secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || secrets.AZURE_RESOURCE_GROUP }}
      AZURE_NAME_SUFFIX: ${{ vars.AZURE_NAME_SUFFIX }}
      AZURE_NAME_SUFFIX_STR: ${{ vars.AZURE_NAME_SUFFIX_STR }}
      AZURE_COSMOS_ACCOUNT_NAME: ${{ vars.AZURE_COSMOS_ACCOUNT_NAME }}
      GHCR_PULL_USERNAME: ${{ vars.GHCR_PULL_USERNAME }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      GATEWAY_AUTH_CLIENT_ID: ${{ vars.GATEWAY_AUTH_CLIENT_ID }}
      GATEWAY_AUTH_CLIENT_SECRET: ${{ secrets.GATEWAY_AUTH_CLIENT_SECRET }}
      API_AUTH_CLIENT_ID: ${{ vars.API_AUTH_CLIENT_ID }}
      API_AUTH_AUDIENCE: ${{ vars.API_AUTH_AUDIENCE }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check deployment secrets
        run: |
          missing=0
          for name in GHCR_PULL_TOKEN GATEWAY_AUTH_CLIENT_SECRET; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub repository secret: $name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Azure login
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6f # v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy full stack
        run: |
          DEPLOYMENT_NAME="apps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          IMAGE_TAG="${{ needs.deploy-foundation.outputs.image_tag }}"
          API_AUTH_PARAMS=()
          if [ -n "$API_AUTH_CLIENT_ID" ]; then
            API_AUTH_PARAMS+=(--parameters)
            API_AUTH_PARAMS+=(apiAuthClientId="$API_AUTH_CLIENT_ID")
            API_AUTH_PARAMS+=(apiAuthAudience="${API_AUTH_AUDIENCE:-api://$API_AUTH_CLIENT_ID}")
          fi

          az deployment group create \
            --name "$DEPLOYMENT_NAME" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file "$TEMPLATE_FILE" \
            --parameters "$PARAMETERS_FILE" \
            --parameters imageTag="$IMAGE_TAG" deployContainerApps=true nameSuffix="$AZURE_NAME_SUFFIX" nameSuffixStr="$AZURE_NAME_SUFFIX_STR" cosmosAccountName="$AZURE_COSMOS_ACCOUNT_NAME" containerImageRegistry="$IMAGE_REGISTRY" \
            --parameters gatewayAuthClientId="$GATEWAY_AUTH_CLIENT_ID" gatewayAuthClientSecret="$GATEWAY_AUTH_CLIENT_SECRET" \
            --parameters ghcrPullUsername="$GHCR_PULL_USERNAME" ghcrPullToken="$GHCR_PULL_TOKEN" \
            "${API_AUTH_PARAMS[@]}" \
            --output table

          CONTAINER_APPS_DEPLOYED=$(az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "$DEPLOYMENT_NAME" \
            --query "properties.outputs.containerAppsDeployed.value" \
            --output tsv)

          if [ "$CONTAINER_APPS_DEPLOYED" != "true" ]; then
            echo "Bicep omitted Container Apps because authentication configuration was incomplete." >&2
            exit 1
          fi

      - name: Show Gateway URL
        run: |
          az deployment group show \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --name "apps-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --query "properties.outputs.{gatewayUrl:gatewayContainerAppUrl.value,apiName:containerAppName.value,workerName:workerContainerAppName.value,gatewayName:gatewayContainerAppName.value}" \
            --output table
