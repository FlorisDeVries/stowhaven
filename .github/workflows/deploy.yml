name: Deploy Azure Function & Infra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  LOCATION: westeurope
  RG_NAME: rg-fdev-weu-backup-prd
  NAME_SUFFIX: fdev-weu-prd
  NAME_SUFFIX_STR: fdevweuprd

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      function-name: ${{ steps.deploy-infra.outputs.function-name }}
      storage-name: ${{ steps.deploy-infra.outputs.storage-name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name $RG_NAME --location $LOCATION

      - name: Deploy Infrastructure
        id: deploy-infra
        run: |
          DEPLOYMENT_NAME="infra-$(date +%Y%m%d-%H%M%S)"
          echo "Deploying with name: $DEPLOYMENT_NAME"
          
          az deployment group create \
            --resource-group $RG_NAME \
            --template-file infra/main.bicep \
            --parameters location=$LOCATION \
            --parameters nameSuffix=$NAME_SUFFIX \
            --parameters nameSuffixStr=$NAME_SUFFIX_STR \
            --parameters lifecycleArchiveAfterDays=30 \
            --name $DEPLOYMENT_NAME \
            --output json > deployment-output.json
          
          # Extract outputs
          FUNC_NAME=$(jq -r '.properties.outputs.functionAppName.value' deployment-output.json)
          STORAGE_NAME=$(jq -r '.properties.outputs.dataStorageAccountName.value' deployment-output.json)
          
          echo "Function App: $FUNC_NAME"
          echo "Storage Account: $STORAGE_NAME"
          
          echo "function-name=$FUNC_NAME" >> $GITHUB_OUTPUT
          echo "storage-name=$STORAGE_NAME" >> $GITHUB_OUTPUT

  function:
    runs-on: ubuntu-latest
    needs: infrastructure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .python_packages/lib/site-packages

      - name: Build package
        working-directory: api
        run: |
          zip -r ../function-package.zip . -x "__pycache__/*" "*.pyc" "tests/*"

      - name: Deploy Function App
        run: |
          az functionapp deploy \
            --resource-group $RG_NAME \
            --name ${{ needs.infrastructure.outputs.function-name }} \
            --src-path function-package.zip \
            --type zip

      - name: Verify deployment
        run: |
          FUNC_NAME="${{ needs.infrastructure.outputs.function-name }}"
          echo "Function App: $FUNC_NAME"
          echo "Storage Account: ${{ needs.infrastructure.outputs.storage-name }}"
          
          # Wait for function to be ready
          for i in {1..10}; do
            STATE=$(az functionapp show -g $RG_NAME -n $FUNC_NAME --query "state" -o tsv)
            echo "Function App state: $STATE"
            if [ "$STATE" = "Running" ]; then
              echo "Function App is running successfully"
              break
            fi
            echo "Waiting for Function App to start... ($i/10)"
            sleep 30
          done
          
          echo "Function App URL: https://$FUNC_NAME.azurewebsites.net"
