name: Deploy Azure Function & Infra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  LOCATION: westeurope
  RG_NAME: rg-fdev-weu-backup-prd
  NAME_SUFFIX: fdev-weu-prd
  NAME_SUFFIX_STR: fdevweuprd

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      function-name: ${{ steps.deploy-arm.outputs.functionAppName }}
      storage-name: ${{ steps.deploy-arm.outputs.dataStorageAccountName }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: |
          az group create --name $RG_NAME --location $LOCATION

      - name: Deploy ARM Template
        id: deploy-arm
        uses: azure/arm-deploy@v2
        with:
          subscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          resourceGroupName: ${{ env.RG_NAME }}
          template: ./infra/main.bicep
          parameters: >
            location=${{ env.LOCATION }}
            nameSuffix=${{ env.NAME_SUFFIX }}
            nameSuffixStr=${{ env.NAME_SUFFIX_STR }}
            lifecycleArchiveAfterDays=30

  function:
    runs-on: ubuntu-latest
    needs: infrastructure
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .python_packages/lib/site-packages

      - name: Build package
        working-directory: api
        run: |
          zip -r ../function-package.zip . -x "__pycache__/*" "*.pyc" "tests/*"

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ needs.infrastructure.outputs.function-name }}
          package: function-package.zip

      - name: Verify deployment
        run: |
          FUNC_NAME="${{ needs.infrastructure.outputs.function-name }}"
          echo "Function App: $FUNC_NAME"
          echo "Storage Account: ${{ needs.infrastructure.outputs.storage-name }}"
          echo "Function App URL: https://$FUNC_NAME.azurewebsites.net"
