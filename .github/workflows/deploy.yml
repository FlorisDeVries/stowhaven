name: Deploy Azure Function & Infra

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  LOCATION: westeurope
  RG_NAME: rg-fdev-weu-backup-prd
  NAME_SUFFIX: fdev-weu-prd
  NAME_SUFFIX_STR: fdevweuprd

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        run: |
          az account show
          az account set --subscription $AZURE_SUBSCRIPTION_ID

      - name: Create Resource Group
        run: |
          az group create -n $RG_NAME -l $LOCATION

      - name: Deploy Bicep with retry
        run: |
          for i in {1..3}; do
            echo "Deployment attempt $i of 3"
            if az deployment group create \
              -g $RG_NAME \
              -f infra/main.bicep \
              -p location=$LOCATION \
              -p nameSuffix=$NAME_SUFFIX \
              -p nameSuffixStr=$NAME_SUFFIX_STR \
              -p lifecycleArchiveAfterDays=30 \
              --verbose \
              --name "deploy-$(date +%Y%m%d-%H%M%S)"; then
              echo "Deployment successful"
              break
            else
              echo "Deployment failed, waiting 30 seconds before retry..."
              if [ $i -lt 3 ]; then
                sleep 30
              else
                echo "All deployment attempts failed"
                exit 1
              fi
            fi
          done

      - name: Resolve outputs
        id: outputs
        run: |
          echo "Getting latest deployment..."
          LATEST_DEPLOYMENT=$(az deployment group list -g $RG_NAME --query "max_by([], &properties.timestamp).name" -o tsv)
          echo "Latest deployment: $LATEST_DEPLOYMENT"
          
          if [ -z "$LATEST_DEPLOYMENT" ] || [ "$LATEST_DEPLOYMENT" = "null" ]; then
            echo "No deployment found, trying alternative approach..."
            LATEST_DEPLOYMENT=$(az deployment group list -g $RG_NAME --query "[0].name" -o tsv)
          fi
          
          echo "Getting deployment outputs..."
          az deployment group show -g $RG_NAME -n $LATEST_DEPLOYMENT --query "properties.outputs" -o json
          
          FUNC_NAME=$(az deployment group show -g $RG_NAME -n $LATEST_DEPLOYMENT --query "properties.outputs.functionAppName.value" -o tsv)
          DATA_SA=$(az deployment group show -g $RG_NAME -n $LATEST_DEPLOYMENT --query "properties.outputs.dataStorageAccountName.value" -o tsv)
          
          echo "Function App Name: $FUNC_NAME"
          echo "Storage Account: $DATA_SA"
          
          if [ -z "$FUNC_NAME" ] || [ "$FUNC_NAME" = "null" ]; then
            echo "ERROR: Function App name not found in deployment outputs"
            exit 1
          fi
          
          if [ -z "$DATA_SA" ] || [ "$DATA_SA" = "null" ]; then
            echo "ERROR: Storage Account name not found in deployment outputs"
            exit 1
          fi
          
          echo "FUNC_NAME=$FUNC_NAME" >> $GITHUB_ENV
          echo "DATA_SA=$DATA_SA" >> $GITHUB_ENV

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -t .python_packages/lib/site-packages

      - name: Build package
        working-directory: api
        run: |
          zip -r ../package.zip . -x "__pycache__/*" "*.pyc" "tests/*"

      - name: Deploy Function with retry
        run: |
          for i in {1..3}; do
            echo "Function deployment attempt $i of 3"
            if az functionapp deploy \
              --resource-group $RG_NAME \
              --name $FUNC_NAME \
              --src-path package.zip \
              --type zip; then
              echo "Function deployment successful"
              break
            else
              echo "Function deployment failed, waiting 30 seconds before retry..."
              if [ $i -lt 3 ]; then
                sleep 30
              fi
            fi
          done

      - name: Verify deployment
        run: |
          echo "Verifying Function App is running..."
          az functionapp show -g $RG_NAME -n $FUNC_NAME --query "state" -o tsv
          echo "Function App URL: https://$FUNC_NAME.azurewebsites.net"
